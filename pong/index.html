<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Simple Pong</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="container">
    <h1>Simple Pong</h1>
    <div id="scoreboard">Player: <span id="playerScore">0</span> &nbsp;—&nbsp; Computer: <span id="computerScore">0</span></div>
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <p class="hint">Use mouse or Arrow Up / Arrow Down to move the left paddle.</p>
    <button id="restartBtn">Restart</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
